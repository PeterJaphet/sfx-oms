<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="brand-reference.css">
<style>
body{margin:0;background:#FFF7EB}
a{color:#B01E31}a:hover{color:#8C1727}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EB; font-family: Antic, 'League Spartan', system-ui, sans-serif; color: #2C2C2C; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #EBE2D4; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #645B50">Mon 12 Oct · Increase</span>
        <h1 style="margin: 0; font-family: 'League Spartan', Antic, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.01em">New order <span style="color: #D7263D">#014</span></h1>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #FFF7EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 15px" aria-hidden="true"><img src="../../public/brand/burger-mark.svg" alt="" style="width: 100%; height: auto"></div>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px" role="group" aria-label="Order channel">
      <sc-for list="{{channels}}" as="ch" hint-placeholder-count="6">
        <button type="button" onClick="{{ch.pick}}" style="{{ch.style}}" aria-pressed="{{ch.on}}">{{ch.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid #9B8976; border-radius: 12px; background: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#645B50" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search menu</span>
      <input type="search" placeholder="Search menu" style="border: 0; outline: 0; flex: 1; font: inherit; font-size: 15px; background: transparent; color: #2C2C2C">
    </label>
    <div style="display: flex; gap: 6px; overflow-x: auto" role="tablist" aria-label="Menu categories">
      <sc-for list="{{categories}}" as="c" hint-placeholder-count="6">
        <button type="button" role="tab" onClick="{{c.pick}}" style="{{c.style}}" aria-selected="{{c.on}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 12px 16px 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
        <button type="button" onClick="{{p.add}}" style="{{p.cardStyle}}" aria-label="Add {{p.name}}, {{p.priceLabel}}">
          <span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 6px">
            <span style="font-size: 12px; font-weight: 600; color: #645B50; text-transform: uppercase; letter-spacing: 0.06em">{{p.category}}</span>
            <sc-if value="{{p.inCart}}" hint-placeholder-val="{{false}}">
              <span style="min-width: 24px; height: 24px; border-radius: 12px; background: #D7263D; color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box">{{p.qty}}</span>
            </sc-if>
          </span>
          <span style="font-size: 16px; font-weight: 600; line-height: 1.25; text-align: left">{{p.name}}</span>
          <span style="font-size: 15px; font-weight: 700; color: #2C2C2C; text-align: left">{{p.priceLabel}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #EBE2D4; display: flex; align-items: center; gap: 12px">
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 13px; color: #645B50">{{cartCount}} items</span>
      <span style="font-size: 22px; font-weight: 700">{{cartTotal}}</span>
    </div>
    <button type="button" onClick="{{clear}}" style="height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid #9B8976; background: #FFFFFF; color: #2C2C2C; font-weight: 600">Clear</button>
    <a href="Checkout.dc.html" style="height: 48px; padding: 0 22px; border-radius: 12px; background: #D7263D; color: #FFFFFF; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; text-decoration: none">Charge</a>
  </div>

  <nav style="height: 64px; background: #FFFFFF; border-top: 1px solid #EBE2D4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))" aria-label="Main">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: #D7263D; text-decoration: none" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New order</a>
    <a href="Orders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #645B50; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>Orders</a>
    <a href="Withdraw.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #645B50; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
    <a href="DailyClose.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #645B50; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Close day</a>
    <a href="Dashboard.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #645B50; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg>Reports</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { channel: 'walk_in', category: 'All', cart: { b2: 2, r2: 1 } };
  }
  renderVals() {
    var self = this;
    var menu = [
      { id: 'r1', name: 'Native Rice + Chicken', category: 'Rice & Soup', price: 450, extras: true },
      { id: 'r2', name: 'Jollof Rice + Chicken', category: 'Rice & Soup', price: 420, extras: true },
      { id: 'r3', name: 'Vegetable Soup', category: 'Rice & Soup', price: 350, extras: true },
      { id: 'b1', name: 'Classic Burger', category: 'Burgers', price: 400 },
      { id: 'b2', name: 'BBQ Burger', category: 'Burgers', price: 400 },
      { id: 'b3', name: 'Zinger Burger', category: 'Burgers', price: 400 },
      { id: 'b4', name: 'Chips', category: 'Burgers', price: 50 },
      { id: 's1', name: 'Classic Shawarma', category: 'Shawarma', price: 370 },
      { id: 's2', name: 'Suya Shawarma', category: 'Shawarma', price: 400 },
      { id: 's3', name: 'Congolese Shawarma', category: 'Shawarma', price: 400 },
      { id: 'x1', name: 'Turkey', category: 'Extras', price: 300 },
      { id: 'x2', name: 'Fish', category: 'Extras', price: 180 },
      { id: 'x3', name: 'Chicken', category: 'Extras', price: 150 },
      { id: 'x4', name: 'Shaki', category: 'Extras', price: 70 },
      { id: 'x5', name: 'Ponmo', category: 'Extras', price: 70 },
      { id: 'x6', name: 'Salad', category: 'Extras', price: 70 },
      { id: 'x7', name: 'Egg', category: 'Extras', price: 50 },
      { id: 'x8', name: 'Swallow', category: 'Extras', price: 50 }
    ];
    var fmt = function (n) { return '₺' + n.toLocaleString('en-US'); };
    var chip = function (on) {
      return 'height: 36px; padding: 0 14px; border-radius: 18px; white-space: nowrap; font-size: 14px; font-weight: 600; border: 1px solid ' +
        (on ? '#2C2C2C; background: #2C2C2C; color: #FFFFFF' : '#9B8976; background: #FFFFFF; color: #2C2C2C');
    };
    var chans = [['walk_in', 'Walk-in'], ['whatsapp', 'WhatsApp'], ['instagram', 'Instagram'], ['phone', 'Phone'], ['delivery_app', 'Delivery app'], ['event', 'Event']];
    var cats = ['All', 'Rice & Soup', 'Burgers', 'Shawarma', 'Extras'];
    var cart = this.state.cart;
    var count = 0, total = 0;
    menu.forEach(function (m) { var q = cart[m.id] || 0; count += q; total += q * m.price; });
    return {
      channels: chans.map(function (c) {
        var on = self.state.channel === c[0];
        return { label: c[1], on: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ channel: c[0] }); } };
      }),
      categories: cats.map(function (c) {
        var on = self.state.category === c;
        return { label: c, on: on ? 'true' : 'false', style: chip(on).replace('#2C2C2C; background: #2C2C2C', '#D7263D; background: #D7263D'), pick: function () { self.setState({ category: c }); } };
      }),
      products: menu.filter(function (m) { return self.state.category === 'All' || m.category === self.state.category; }).map(function (m) {
        var q = cart[m.id] || 0;
        return {
          name: m.name, category: m.extras ? m.category + ' · + extras' : m.category, priceLabel: fmt(m.price), qty: q, inCart: q > 0,
          cardStyle: 'min-height: 118px; padding: 12px; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; background: #FFFFFF; color: #2C2C2C; border: ' + (q > 0 ? '2px solid #D7263D' : '1px solid #EBE2D4'),
          add: function () { var c = Object.assign({}, self.state.cart); c[m.id] = (c[m.id] || 0) + 1; self.setState({ cart: c }); }
        };
      }),
      cartCount: count,
      cartTotal: fmt(total),
      clear: function () { self.setState({ cart: {} }); }
    };
  }
}
</script>
</body>
</html>
