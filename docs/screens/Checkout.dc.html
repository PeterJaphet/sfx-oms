<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F4}
a{color:#B01E31}a:hover{color:#8C1727}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F4; font-family: Archivo, system-ui, sans-serif; color: #1C1615; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 16px; background: #FFFFFF; border-bottom: 1px solid #EDE6E1; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to order" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2D8D2; display: flex; align-items: center; justify-content: center; color: #1C1615">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #6B605C">Order #014 · Walk-in · Pickup</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 24px; font-weight: 800">Payment</h1>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">

    <section style="background: #FFFFFF; border: 1px solid #EDE6E1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px" aria-label="Order summary">
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span>2 × BBQ Burger</span><span style="font-weight: 600">₺800</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span>1 × Jollof Rice + Chicken</span><span style="font-weight: 600">₺420</span></div>
      <div style="height: 1px; background: #EDE6E1"></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #6B605C"><span>Discount</span><button type="button" style="border: 0; background: none; color: #B01E31; font-weight: 600; padding: 0; font-size: 14px">Add discount</button></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">Total</span><span style="font-size: 26px; font-weight: 700">₺1,220</span></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px" aria-label="Pay with">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B605C">Pay with</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="7">
          <button type="button" style="{{a.style}}" aria-pressed="{{a.on}}">
            <span style="font-size: 14px; font-weight: 700">{{a.name}}</span>
            <span style="font-size: 11px; font-weight: 600; opacity: 0.8">{{a.cur}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 2px solid #D7263D; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px" aria-label="Naira payment">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 700">Naira payment</span>
        <span style="font-size: 12px; font-weight: 700; color: #7A4B00; background: #FFF1D1; padding: 4px 8px; border-radius: 6px">Needs rate</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #6B605C">Covers (₺)
          <input value="410" inputmode="decimal" style="height: 44px; border: 1px solid #E2D8D2; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 17px; font-weight: 600; color: #1C1615"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #6B605C">Received (₦)
          <input value="15,000" inputmode="decimal" style="height: 44px; border: 1px solid #E2D8D2; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 17px; font-weight: 600; color: #1C1615"></label>
      </div>
      <p style="margin: 0; font-size: 13px; color: #6B605C">Rate used: ₦1 = ₺0.0273 · today's default ₺0.0270</p>
      <button type="button" style="height: 44px; border-radius: 10px; border: 0; background: #1C1615; color: #FFFFFF; font-weight: 700">Add payment</button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px" aria-label="Payments added">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B605C">Payments</h2>
      <div style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 1px solid #EDE6E1; border-radius: 12px; padding: 12px 14px">
        <span style="font-weight: 600">Cash</span><span style="font-weight: 700">₺780</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 1px solid #EDE6E1; border-radius: 12px; padding: 12px 14px">
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Naira</span><span style="font-size: 13px; color: #6B605C">₦15,000</span></span><span style="font-weight: 700">₺410</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; background: #FFF1D1; border-radius: 12px; padding: 12px 14px">
        <span style="font-weight: 700; color: #7A4B00">Still due</span><span style="font-weight: 800; font-size: 18px; color: #7A4B00">₺30</span>
      </div>
    </section>
  </div>

  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #EDE6E1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="Orders.dc.html" style="height: 52px; border-radius: 12px; border: 1px solid #E2D8D2; color: #1C1615; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save as unpaid</a>
    <a href="Orders.dc.html" style="height: 52px; border-radius: 12px; background: #D7263D; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Send to kitchen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [['Cash', '₺'], ['İşbank', '₺'], ['Koop', '₺'], ['SFx', '$'], ['RedotPay', '$'], ['Crypto', '$'], ['Naira', '₦']];
    return {
      accounts: list.map(function (a) {
        var on = a[0] === 'Naira';
        return {
          name: a[0], cur: a[1], on: on ? 'true' : 'false',
          style: 'min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; border: ' +
            (on ? '2px solid #D7263D; background: #D7263D; color: #FFFFFF' : '1px solid #E2D8D2; background: #FFFFFF; color: #1C1615')
        };
      })
    };
  }
}
</script>
</body>
</html>
