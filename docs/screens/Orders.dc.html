<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F4}
a{color:#B01E31}a:hover{color:#8C1727}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F4; font-family: Archivo, system-ui, sans-serif; color: #1C1615; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #EDE6E1; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 26px; font-weight: 800">Orders</h1>
      <span style="font-size: 14px; color: #6B605C">Today · 13 orders · ₺4,920</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: #F3EDE9; padding: 4px; border-radius: 12px" role="tablist" aria-label="Order status">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font-weight: 700; font-size: 14px; color: #1C1615">New 2</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 14px; color: #6B605C">Cooking 3</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 14px; color: #6B605C">Ready 1</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 14px; color: #6B605C">All</button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
      <article style="background: #FFFFFF; border: 1px solid #EDE6E1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">#{{o.num}}</span>
            <span style="font-size: 13px; color: #6B605C">{{o.time}} · {{o.channel}}</span>
          </div>
          <span style="{{o.payStyle}}">{{o.pay}}</span>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.4">{{o.items}}</p>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <div style="display: flex; gap: 6px; align-items: center">
            <span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: #F3EDE9; color: #4A403C">{{o.type}}</span>
            <span style="font-size: 16px; font-weight: 700">{{o.total}}</span>
          </div>
          <button type="button" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #1C1615; color: #FFFFFF; font-weight: 700">{{o.action}}</button>
        </div>
      </article>
    </sc-for>
  </div>

  <nav style="height: 64px; background: #FFFFFF; border-top: 1px solid #EDE6E1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))" aria-label="Main">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #6B605C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New order</a>
    <a href="Orders.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: #D7263D; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>Orders</a>
    <a href="Withdraw.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #6B605C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
    <a href="DailyClose.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #6B605C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Close day</a>
    <a href="Dashboard.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #6B605C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg>Reports</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var paid = 'font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: #E3F3EA; color: #1F6B45';
    var unpaid = 'font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: #FFF1D1; color: #7A4B00';
    return {
      orders: [
        { num: '014', time: '16:42', channel: 'Walk-in', items: '2 × BBQ Burger, 1 × Jollof Rice + Chicken', type: 'Pickup', total: '₺1,220', pay: '₺30 due', payStyle: unpaid, action: 'Start cooking' },
        { num: '013', time: '16:38', channel: 'WhatsApp', items: '1 × Zinger Burger, 1 × Suya Shawarma', type: 'Delivery', total: '₺800', pay: 'Unpaid', payStyle: unpaid, action: 'Start cooking' },
        { num: '012', time: '16:21', channel: 'Instagram', items: '3 × Native Rice + Chicken', type: 'Delivery', total: '₺1,350', pay: 'Paid · İşbank', payStyle: paid, action: 'Mark ready' },
        { num: '011', time: '16:15', channel: 'Walk-in', items: '1 × Vegetable Soup + Swallow, Fish', type: 'Dine-in', total: '₺580', pay: 'Paid · Cash', payStyle: paid, action: 'Mark ready' },
        { num: '010', time: '16:02', channel: 'Phone', items: '2 × Classic Shawarma', type: 'Pickup', total: '₺740', pay: 'Paid · SFx', payStyle: paid, action: 'Mark ready' }
      ]
    };
  }
}
</script>
</body>
</html>
