<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFx Burger — Extra quantities</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fbf7f4;color:#1c1615;font:16px system-ui,sans-serif}.sheet{max-width:430px;margin:auto;background:#fff;padding:24px 20px;border-radius:20px 20px 0 0}h1{font-size:26px;margin:0 0 8px}p{color:#6b605c;font-size:13px;line-height:1.5}h2,legend{font-size:14px;font-weight:700}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #ede6e1;padding:12px 0}.count{display:flex;gap:4px;align-items:center}button,input{min-height:44px;border:1px solid #e2d8d2;background:white;border-radius:8px;font:inherit;text-align:center}button{min-width:44px;font-weight:700}input{width:64px}label{font-weight:600;font-size:14px}.price{font-size:12px;color:#6b605c;margin-top:4px}.submit{width:100%;margin-top:24px;background:#d7263d;color:white;border:0}fieldset{border:0;padding:0;margin:20px 0}textarea{width:100%;border:1px solid #e2d8d2;border-radius:8px;padding:12px;font:inherit}.example{background:#fbf7f4;padding:12px;border-radius:10px}</style></head>
<body><main class="sheet"><h1>Vegetable Soup</h1><p>Choose a variant, extras and quantity.</p><div class="row"><span>◉ Regular</span><strong>₺350</strong></div>
<fieldset><legend>Extras</legend><p>Extra quantities are totals for this item line. Changing dish quantity keeps these counts.</p>
<div class="row"><div><label for="swallow">Swallow</label><div class="price">₺50 each</div></div><div class="count"><button type="button" aria-label="Decrease Swallow quantity">−</button><input id="swallow" type="number" inputmode="numeric" min="0" max="999" value="4"><button type="button" aria-label="Increase Swallow quantity">+</button></div></div>
<div class="row"><div><label for="fish">Fish</label><div class="price">₺180 each</div></div><div class="count"><button type="button" aria-label="Decrease Fish quantity">−</button><input id="fish" type="number" inputmode="numeric" min="0" max="999" value="0"><button type="button" aria-label="Increase Fish quantity">+</button></div></div></fieldset>
<label for="dish">Dish quantity</label><div class="count" style="margin-top:8px"><button type="button" aria-label="Decrease quantity">−</button><input id="dish" type="number" inputmode="numeric" min="1" max="999" value="2"><button type="button" aria-label="Increase quantity">+</button></div>
<p class="example">2 Vegetable Soup + 4 Swallow<br><strong>₺900</strong> · database quote example</p><label for="note">Item note (optional)</label><textarea id="note" rows="2"></textarea><button type="button" class="submit">Add to order</button></main></body></html>
