<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log supplies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="brand-reference.css">
<style>
body{margin:0;background:#FFF7EB}
a{color:#B01E31}a:hover{color:#8C1727}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EB; font-family: Antic, 'League Spartan', system-ui, sans-serif; color: #2C2C2C; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 16px; background: #FFFFFF; border-bottom: 1px solid #EBE2D4; display: flex; align-items: center; gap: 12px">
    <a href="Deliveries.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #9B8976; display: flex; align-items: center; justify-content: center; color: #2C2C2C">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'League Spartan', Antic, sans-serif; font-size: 24px; font-weight: 800">Log supplies bought</h1>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #645B50; padding: 0; margin-bottom: 8px">Paid with</legend>
      <button type="button" role="radio" aria-checked="true" style="border-radius: 12px; padding: 12px 14px; border: 2px solid #D7263D; background: #FFFFFF; color: #2C2C2C; display: flex; justify-content: space-between; align-items: center; text-align: left">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">My advance</span><span style="font-size: 13px; color: #645B50">Chicken and burger bread · today</span></span>
        <span style="font-weight: 700">₺1,000 left</span></button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" role="radio" aria-checked="false" style="height: 48px; border-radius: 12px; padding: 0 14px; border: 1px solid #9B8976; background: #FFFFFF; color: #2C2C2C; font-weight: 600; text-align: left">From an account</button>
        <button type="button" role="radio" aria-checked="false" style="height: 48px; border-radius: 12px; padding: 0 14px; border: 1px solid #9B8976; background: #FFFFFF; color: #2C2C2C; font-weight: 600; text-align: left">On credit</button>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Supplier
      <input value="Metro Market, Mağusa" style="height: 48px; border: 1px solid #9B8976; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; color: #2C2C2C; background: #FFFFFF"></label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Category</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px" role="radiogroup" aria-label="Category">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button type="button" role="radio" aria-checked="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px" aria-label="Items">
      <span style="font-size: 14px; font-weight: 600">Items</span>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid #EBE2D4; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{it.desc}}</span><span style="font-size: 13px; color: #645B50">{{it.qty}}</span></span>
          <span style="font-weight: 700">{{it.amount}}</span>
        </div>
      </sc-for>
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px dashed #C9BCB4; background: transparent; color: #2C2C2C; font-weight: 600">+ Add item</button>
    </section>

    <button type="button" style="height: 52px; border-radius: 12px; border: 1px dashed #C9BCB4; background: #FFFFFF; color: #2C2C2C; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>
      Photo of receipt</button>
  </div>

  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #EBE2D4; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #645B50"><span>Total ₺900 · left in advance after this</span><span style="font-weight: 700; color: #2C2C2C">₺100</span></div>
    <button type="button" style="width: 100%; height: 52px; border-radius: 12px; border: 0; background: #D7263D; color: #FFFFFF; font-weight: 700; font-size: 16px">Save purchase · ₺900</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = ['Meat, chicken & offal', 'Rice, flour & grains', 'Vegetables & peppers', 'Oils, spices & seasoning', 'Sauces & dairy', 'Bread & wraps', 'Packaging', 'Gas', 'Transport'];
    return {
      cats: list.map(function (c) {
        var on = c === 'Meat, chicken & offal';
        return {
          label: c, on: on ? 'true' : 'false',
          style: 'height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid ' +
            (on ? '#2C2C2C; background: #2C2C2C; color: #FFFFFF' : '#9B8976; background: #FFFFFF; color: #2C2C2C')
        };
      }),
      items: [
        { desc: 'Chicken thighs', qty: '4 kg', amount: '₺720' },
        { desc: 'Burger bread', qty: '24 pcs', amount: '₺180' }
      ]
    };
  }
}
</script>
</body>
</html>
